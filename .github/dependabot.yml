version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # schemars::JsonSchema is part of the public API under --features schema;
      # defer major upgrades (0.8 -> 1.x) to a breaking 2.0 release.
      - dependency-name: "schemars"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/crates/dealbreaker-py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
