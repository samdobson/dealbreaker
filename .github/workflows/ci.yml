name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p dealbreaker --lib --no-default-features
      - run: cargo test -p dealbreaker --lib --features schema
      - run: cargo test -p dealbreaker --lib --features parallel
      # Release mode: the solver tests search hundreds of thousands of positions.
      - run: cargo test --workspace --release
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p dealbreaker -p dealbreaker-cli

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p dealbreaker-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build-wasm.sh nodejs
      - run: node scripts/smoke.mjs
      - run: ./scripts/build-npm.sh
      - run: npm test --prefix js
      - name: Verify js/package.json version matches Cargo.toml
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          JS_VERSION="$(node -p 'require("./js/package.json").version')"
          test "$CARGO_VERSION" = "$JS_VERSION"
      - name: Type-check JS/TS declarations
        run: npx --yes -p typescript tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 js/src/index.d.ts js/src/worker.d.ts

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: dealbreaker

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/dealbreaker-py
      - run: cargo clippy --manifest-path crates/dealbreaker-py/Cargo.toml -- -D warnings
      - run: pip install maturin pytest
      - run: maturin develop --release --manifest-path crates/dealbreaker-py/Cargo.toml
      - run: pytest -v crates/dealbreaker-py/tests
      - name: Verify pyproject.toml version matches Cargo.toml
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          PY_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/dealbreaker-py/pyproject.toml | head -n1)"
          test "$CARGO_VERSION" = "$PY_VERSION"
