name: Deploy Docs & Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "js/src/**"
      - "crates/dealbreaker/**"
      - "crates/dealbreaker-wasm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build VitePress docs
        run: |
          npm --prefix docs ci
          npm --prefix docs run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: ./scripts/build-npm.sh

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/demo _site/js
          cp -r docs/.vitepress/dist/* _site/
          cp -r demo/* _site/demo/
          cp -r js/src js/wasm _site/js/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
