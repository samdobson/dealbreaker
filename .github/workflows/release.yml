name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml and js/package.json
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          JS_VERSION="$(node -p 'require("./js/package.json").version')"
          PY_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/dealbreaker-py/pyproject.toml | head -n1)"
          echo "tag=$TAG_VERSION cargo=$CARGO_VERSION js=$JS_VERSION py=$PY_VERSION"
          test "$TAG_VERSION" = "$CARGO_VERSION"
          test "$TAG_VERSION" = "$JS_VERSION"
          test "$TAG_VERSION" = "$PY_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish dealbreaker to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          if ! out="$(cargo publish -p dealbreaker 2>&1)"; then
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
            echo "dealbreaker already published; continuing"
          else
            echo "$out"
          fi
      - name: Wait for crates.io index and publish dealbreaker-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            sleep 20
            if out="$(cargo publish -p dealbreaker-cli 2>&1)"; then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -q "already exists"; then
              echo "dealbreaker-cli already published; continuing"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying..."
          done
          exit 1

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: ./scripts/build-npm.sh
      - run: npm test --prefix js
      # Uses npm Trusted Publishing (OIDC) when NPM_TOKEN is unset.
      # For the initial publish (before the package exists on npmjs.com), set NPM_TOKEN
      # temporarily, then attach release.yml under Package Settings -> Trusted Publishers
      # and delete NPM_TOKEN.
      - name: Configure temporary npm token (initial publish only)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
      - name: Publish dealbreaker to npm
        working-directory: js
        run: npm publish --provenance --access public

  build-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release -p dealbreaker-cli --target ${{ matrix.target }}
      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="dealbreaker-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/dealbreaker" "dist/$NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "dealbreaker-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dealbreaker.exe" "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  build-ffi:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ffi-${{ matrix.target }}
      - run: cargo build --release -p dealbreaker-ffi --target ${{ matrix.target }}
      - name: Package FFI archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="dealbreaker-ffi-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME/include" "dist/$NAME/lib"
          cp crates/dealbreaker-ffi/include/dealbreaker.h crates/dealbreaker-ffi/include/module.modulemap "dist/$NAME/include/"
          cp "target/${{ matrix.target }}/release/libdealbreaker_ffi."* "dist/$NAME/lib/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
      - name: Package FFI archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "dealbreaker-ffi-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/include", "dist/$name/lib" | Out-Null
          Copy-Item crates/dealbreaker-ffi/include/dealbreaker.h, crates/dealbreaker-ffi/include/module.modulemap "dist/$name/include/"
          Copy-Item "target/${{ matrix.target }}/release/dealbreaker_ffi.dll", "target/${{ matrix.target }}/release/dealbreaker_ffi.dll.lib", "target/${{ matrix.target }}/release/dealbreaker_ffi.lib" "dist/$name/lib/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.target }}
          path: dist/*

  github-release:
    needs: [build-binaries, build-ffi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Dealbreaker ${GITHUB_REF_NAME}" \
            --generate-notes

  build-wheels:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            args: --release --out dist --compatibility manylinux2014
          - os: ubuntu-24.04-arm
            target: aarch64
            args: --release --out dist --compatibility manylinux2014
          - os: macos-latest
            target: aarch64
            args: --release --out dist
          - os: macos-latest
            target: x86_64
            args: --release --out dist
          - os: windows-latest
            target: x64
            args: --release --out dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          working-directory: crates/dealbreaker-py
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/dealbreaker-py/dist/*

  build-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/dealbreaker-py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: crates/dealbreaker-py/dist/*

  publish-pypi:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cli-aarch64-unknown-linux-musl
          path: dist
      - name: Prepare Docker build context
        shell: bash
        run: |
          mkdir -p docker-ctx/linux/amd64 docker-ctx/linux/arm64
          tar -xzf "dist/dealbreaker-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" \
            --strip-components=1 -C docker-ctx/linux/amd64 \
            "dealbreaker-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl/dealbreaker"
          tar -xzf "dist/dealbreaker-${GITHUB_REF_NAME}-aarch64-unknown-linux-musl.tar.gz" \
            --strip-components=1 -C docker-ctx/linux/arm64 \
            "dealbreaker-${GITHUB_REF_NAME}-aarch64-unknown-linux-musl/dealbreaker"
          cat <<'EOF' > docker-ctx/Dockerfile
          FROM scratch
          ARG TARGETOS
          ARG TARGETARCH
          COPY ${TARGETOS}/${TARGETARCH}/dealbreaker /dealbreaker
          USER 65532:65532
          ENTRYPOINT ["/dealbreaker"]
          EOF
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Dealbreaker
            org.opencontainers.image.description=A fast patience (solitaire) solver written in Rust, where every game is data.
            org.opencontainers.image.url=https://samdobson.github.io/dealbreaker/
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/build-push-action@v7
        with:
          context: docker-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
