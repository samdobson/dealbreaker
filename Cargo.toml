[workspace]
resolver = "2"
members = [
    "crates/dealbreaker",
    "crates/dealbreaker-cli",
    "crates/dealbreaker-wasm",
    "crates/dealbreaker-ffi",
]
exclude = ["crates/dealbreaker-py"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/samdobson/dealbreaker"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
