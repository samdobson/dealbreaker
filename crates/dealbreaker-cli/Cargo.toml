[package]
name = "dealbreaker-cli"
description = "Command-line front end for the dealbreaker crate."
readme = "../../README.md"
keywords = ["solitaire", "patience", "solver", "cli"]
categories = ["games", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "dealbreaker"
path = "src/main.rs"
doc = false

[features]
default = ["parallel"]
parallel = ["dealbreaker/parallel", "dep:rayon"]

[dependencies]
dealbreaker = { path = "../dealbreaker", version = "1.2.0" }
rayon = { version = "1", optional = true }
serde_json = "1"
