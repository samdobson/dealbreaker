[package]
name = "dealbreaker-ffi"
description = "Minimal C ABI bindings for the dealbreaker patience (solitaire) solver (C, C++, Swift, Kotlin/JNI, Go, Zig)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "dealbreaker_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dealbreaker = { path = "../dealbreaker", version = "1.2.0", features = ["json", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
