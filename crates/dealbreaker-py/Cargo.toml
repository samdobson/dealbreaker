[package]
name = "dealbreaker-py"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samdobson/dealbreaker"
description = "Python bindings for the dealbreaker patience (solitaire) solver."
publish = false

[lib]
name = "_dealbreaker"
crate-type = ["cdylib"]

[dependencies]
dealbreaker = { path = "../dealbreaker", features = ["json", "parallel"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
