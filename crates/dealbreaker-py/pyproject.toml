[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dealbreaker"
version = "1.2.0"
description = "Fast data-driven patience (solitaire) solver powered by Rust."
readme = "../../README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
keywords = ["solitaire", "patience", "solver", "freecell", "klondike", "spider"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://github.com/samdobson/dealbreaker"
Repository = "https://github.com/samdobson/dealbreaker"

[tool.maturin]
python-source = "python"
module-name = "dealbreaker._dealbreaker"
features = ["pyo3/extension-module"]
