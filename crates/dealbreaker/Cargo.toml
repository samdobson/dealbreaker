[package]
name = "dealbreaker"
description = "A data-driven solver for patience / solitaire card games: describe a game's rules as data, get solutions or proofs of unsolvability."
keywords = ["solitaire", "patience", "solver", "freecell", "klondike"]
categories = ["games", "algorithms"]
readme = "../../README.md"
documentation = "https://docs.rs/dealbreaker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["json"]
## Load and save rules, states and solutions as JSON.
json = ["dep:serde_json"]
## Generate JSON Schemas for rules, states, steps, and options.
schema = ["json", "dep:schemars"]
## Parallelize `hint()` rollouts across CPU cores via `rayon`.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[[example]]
name = "generate_schemas"
required-features = ["schema"]
